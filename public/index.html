<!DOCTYPE html>  
<html lang="hi">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Shubh Labh Bappa - Poster Generator</title>  
    <!-- Cropper.js CSS for Crop Popup -->  
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">  
    <style>  
        * {  
            box-sizing: border-box;  
            margin: 0;  
            padding: 0;  
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;  
        }  
        body {  
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);  
            color: #333;  
            padding: 15px;  
            display: flex;  
            flex-direction: column;  
            align-items: center;  
            min-height: 100vh;  
        }  
        .container {  
            width: 100%;  
            max-width: 450px;  
            background: #ffffff;  
            padding: 20px;  
            border-radius: 12px;  
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);  
            text-align: center;  
        }  
        .channel-title {  
            font-size: 26px;  
            font-weight: bold;  
            color: #ff5722;  
            margin-bottom: 5px;  
            text-transform: uppercase;  
            letter-spacing: 1px;  
        }  
        .channel-link {  
            display: inline-block;  
            margin-bottom: 20px;  
            color: #ffffff;  
            background-color: #ff0000;  
            padding: 8px 16px;  
            border-radius: 20px;  
            text-decoration: none;  
            font-size: 14px;  
            font-weight: 600;  
        }  
        .channel-link:hover {  
            background-color: #cc0000;  
        }  
        .poster-section {  
            margin-bottom: 20px;  
        }  
        .section-title {  
            font-size: 18px;  
            font-weight: 600;  
            margin-bottom: 10px;  
            color: #444;  
        }  
        .poster-preview {  
            width: 100%;  
            background: #f0f0f0;  
            border: 2px dashed #ccc;  
            border-radius: 8px;  
            overflow: hidden;  
            position: relative;  
            display: flex;  
            justify-content: center;  
            align-items: center;  
        }  
        #posterCanvas {  
            width: 100%;  
            height: auto;  
            display: block;  
            border-radius: 8px;  
        }  
        .form-group {  
            margin-bottom: 15px;  
            text-align: left;  
        }  
        .form-group label {  
            display: block;  
            font-size: 14px;  
            font-weight: 600;  
            margin-bottom: 5px;  
            color: #555;  
        }  
        .form-control {  
            width: 100%;  
            padding: 10px 12px;  
            border: 1px solid #ddd;  
            border-radius: 6px;  
            font-size: 14px;  
            outline: none;  
            background: #fff;  
            cursor: pointer;  
        }  
        .form-control:focus {  
            border-color: #ff5722;  
        }  
        .btn {  
            width: 100%;  
            padding: 12px;  
            background-color: #28a745;  
            color: white;  
            border: none;  
            border-radius: 6px;  
            font-size: 16px;  
            font-weight: bold;  
            cursor: pointer;  
            margin-top: 5px;  
        }  
        .btn:hover {  
            background-color: #218838;  
        }  

        /* Popups Styling */  
        .modal-overlay {  
            display: none;  
            position: fixed;  
            z-index: 999;  
            left: 0;  
            top: 0;  
            width: 100%;  
            height: 100%;  
            background-color: rgba(0,0,0,0.8);  
            justify-content: center;  
            align-items: center;  
            flex-direction: column;  
            padding: 20px;  
        }  
        .modal-box {  
            background: #fff;  
            padding: 20px;  
            border-radius: 10px;  
            width: 100%;  
            max-width: 350px;  
            text-align: center;  
        }  
        .modal-box h3 {  
            margin-bottom: 15px;  
            color: #333;  
        }  
        .modal-btn {  
            display: block;  
            width: 100%;  
            padding: 12px;  
            margin-bottom: 10px;  
            background: #007bff;  
            color: white;  
            border: none;  
            border-radius: 6px;  
            font-size: 16px;  
            cursor: pointer;  
            text-decoration: none;  
        }  
        .modal-btn.camera { background: #ff9800; }  
        .modal-btn.gallery { background: #9c27b0; }  
        .modal-btn.cancel { background: #dc3545; }  

        .crop-container {  
            width: 100%;  
            max-width: 400px;  
            height: 350px;  
            background: #fff;  
            padding: 10px;  
            border-radius: 8px;  
            overflow: hidden;  
        }  
        .crop-container img {  
            max-width: 100%;  
            display: block;  
        }  
        .crop-tools {  
            display: flex;  
            gap: 5px;  
            margin: 10px 0;  
            justify-content: center;  
        }  
        .tool-btn {  
            padding: 8px 12px;  
            background: #6c757d;  
            color: white;  
            border: none;  
            border-radius: 4px;  
            cursor: pointer;  
            font-size: 14px;  
        }  
        .crop-btn-group {  
            margin-top: 10px;  
            display: flex;  
            gap: 10px;  
            width: 100%;  
            max-width: 400px;  
        }  
    </style>  
</head>  
<body>  

<div class="container">  
    <!-- 1. Channel Name -->  
    <div class="channel-title">Shubh Labh Bappa</div>  

    <!-- 2. YouTube Channel Link -->  
    <a href="https://youtube.com/@ganpati_shubhlabh23?si=YC3ffPcw5cYLBn_c" target="_blank" class="channel-link">  
        📺 Subscribe YouTube Channel  
    </a>  

    <!-- 3. Poster Preview Section -->  
    <div class="poster-section">  
        <div class="section-title">Preview Poster</div>  
        <div class="poster-preview">  
            <canvas id="posterCanvas"></canvas>  
        </div>  
    </div>  

    <!-- 4. Inputs: Name, Number, Photo Upload & Generate Button -->  
    <div class="form-group">  
        <label for="userName">Apna Naam:</label>  
        <input type="text" id="userName" class="form-control" placeholder="Apna naam yahan likhein" oninput="updatePoster()">  
    </div>  

    <div class="form-group">  
        <label for="userNumber">Mobile Number:</label>  
        <input type="tel" id="userNumber" class="form-control" placeholder="Apna mobile number likhein" oninput="updatePoster()">  
    </div>  

    <div class="form-group">  
        <label>Photo Upload:</label>  
        <button type="button" class="form-control" onclick="openSourceModal()" style="background:#f8f9fa; text-align:left; color:#555;">📷 Choose Camera or Gallery</button>  
        <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;" onchange="handleFileSelect(event)">  
        <input type="file" id="galleryInput" accept="image/*" style="display:none;" onchange="handleFileSelect(event)">  
    </div>  

    <button class="btn" onclick="downloadPoster()">Download Poster</button>  
</div>  

<!-- Popup 1: Choose Camera or Gallery -->  
<div id="sourceModal" class="modal-overlay">  
    <div class="modal-box">  
        <h3>Photo Select Karein</h3>  
        <button class="modal-btn camera" onclick="triggerCamera()">📸 Camera se kheencho</button>  
        <button class="modal-btn gallery" onclick="triggerGallery()">🖼️ Gallery se chuno</button>  
        <button class="modal-btn cancel" onclick="closeSourceModal()">Cancel</button>  
    </div>  
</div>  

<!-- Popup 2: Crop, Zoom & Rotate Modal -->  
<div id="cropModal" class="modal-overlay">  
    <div class="modal-box" style="max-width: 430px;">  
        <h3>Crop, Zoom & Rotate</h3>  
        <div class="crop-container">  
            <img id="imageToCrop" src="">  
        </div>  
        <div class="crop-tools">  
            <button class="tool-btn" onclick="zoomIn()">🔍+</button>  
            <button class="tool-btn" onclick="zoomOut()">🔍-</button>  
            <button class="tool-btn" onclick="rotateLeft()">🔄 ↺</button>  
            <button class="tool-btn" onclick="rotateRight()">🔄 ↻</button>  
        </div>  
        <div class="crop-btn-group">  
            <button class="btn" style="background-color: #dc3545;" onclick="closeCropModal()">Cancel</button>  
            <button class="btn" onclick="cropAndSaveImage()">Crop & Save</button>  
        </div>  
    </div>  
</div>  

<!-- Cropper.js JS Library -->  
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>  
<script>  
    let templateImg = new Image();  
    let croppedImageObj = null;  
    let cropper = null;  
    let isTemplateLoaded = false;  

    const canvas = document.getElementById('posterCanvas');  
    const ctx = canvas.getContext('2d');  

    canvas.width = 1080;  
    canvas.height = 1350;  

    function initTemplate() {  
        templateImg.crossOrigin = "anonymous";  
        templateImg.onload = function() {  
            canvas.width = templateImg.naturalWidth;  
            canvas.height = templateImg.naturalHeight;  
            isTemplateLoaded = true;  
            updatePoster();  
        };  
        templateImg.onerror = function() {  
            isTemplateLoaded = false;  
            updatePoster();  
        };  
        templateImg.src = 'poster-template.png';  
    }  

    initTemplate();  

    function updatePoster() {  
        ctx.clearRect(0, 0, canvas.width, canvas.height);  
          
        if (isTemplateLoaded) {  
            ctx.drawImage(templateImg, 0, 0, canvas.width, canvas.height);  
        } else {  
            ctx.fillStyle = "#ffffff";  
            ctx.fillRect(0, 0, canvas.width, canvas.height);  
            ctx.fillStyle = "#ff5722";  
            ctx.font = 'bold 40px Arial';  
            ctx.textAlign = 'center';  
            ctx.fillText("Please place poster-template.png in folder", canvas.width / 2, canvas.height / 2);  
        }  

        // Photo: Left 20px bada (113 - 20 = 93), Top 20px upar + upar/neeche 30px bada ((1083 - 20) - 30 = 1033), Width 40px bada (159 + 40 = 199), Height 60px bada (178 + 60 = 238)
        let boxX = 93;   
        let boxY = 1033;  
        let boxWidth = (272 - 113) + 40;   // 199
        let boxHeight = (1061 - 883) + 60; // 238  

        if (croppedImageObj) {  
            ctx.drawImage(croppedImageObj, boxX, boxY, boxWidth, boxHeight);  
        }  

        const name = document.getElementById('userName').value;  
        const number = document.getElementById('userNumber').value;  

        // Name: 5 pixel upar kiya (1290 - 5 = 1285)
        if (name) {  
            ctx.fillStyle = '#000000';  
            ctx.font = 'bold 32px Arial';  
            ctx.textAlign = 'left';  
            ctx.textBaseline = 'middle';  
            ctx.fillText(name, 165, 1285);  
        }  

        // Mobile Number: 2 pixel upar kiya (1351 - 2 = 1349)
        if (number) {  
            ctx.fillStyle = '#000000';  
            ctx.font = 'bold 32px Arial';  
            ctx.textAlign = 'left';  
            ctx.textBaseline = 'middle';  
            ctx.fillText(number, 165, 1349);  
        }  
    }  

    function openSourceModal() {  
        document.getElementById('sourceModal').style.display = 'flex';  
    }  
    function closeSourceModal() {  
        document.getElementById('sourceModal').style.display = 'none';  
    }  
    function triggerCamera() {  
        closeSourceModal();  
        document.getElementById('cameraInput').click();  
    }  
    function triggerGallery() {  
        closeSourceModal();  
        document.getElementById('galleryInput').click();  
    }  

    function handleFileSelect(event) {  
        const files = event.target.files;  
        if (files && files.length > 0) {  
            const reader = new FileReader();  
            reader.onload = function(e) {  
                document.getElementById('imageToCrop').src = e.target.result;  
                document.getElementById('cropModal').style.display = 'flex';  
                  
                if (cropper) {  
                    cropper.destroy();  
                }  
                const image = document.getElementById('imageToCrop');  
                cropper = new Cropper(image, {  
                    aspectRatio: ((272 - 113) + 40) / ((1061 - 883) + 60),  
                    viewMode: 1,  
                    autoCropArea: 1,  
                });  
            };  
            reader.readAsDataURL(files[0]);  
        }  
        event.target.value = '';  
    }  

    function closeCropModal() {  
        document.getElementById('cropModal').style.display = 'none';  
        if (cropper) {  
            cropper.destroy();  
            cropper = null;  
        }  
    }  

    function zoomIn() { if (cropper) cropper.zoom(0.1); }  
    function zoomOut() { if (cropper) cropper.zoom(-0.1); }  
    function rotateLeft() { if (cropper) cropper.rotate(-90); }  
    function rotateRight() { if (cropper) cropper.rotate(90); }  

    function cropAndSaveImage() {  
        if (cropper) {  
            const canvasCropped = cropper.getCroppedCanvas({  
                width: (272 - 113) + 40,  
                height: (1061 - 883) + 60  
            });  
              
            croppedImageObj = new Image();  
            croppedImageObj.src = canvasCropped.toDataURL();  
            croppedImageObj.onload = function() {  
                updatePoster();  
                closeCropModal();  
            }  
        }  
    }  

    function downloadPoster() {  
        updatePoster();  
        setTimeout(() => {  
            const dataUrl = canvas.toDataURL('image/png');  
            const link = document.createElement('a');  
            link.download = 'shubh-labh-bappa-poster.png';  
            link.href = dataUrl;  
            document.body.appendChild(link);  
            link.click();  
            document.body.removeChild(link);  
        }, 100);  
    }  
</script>  

</body>  
</html>
