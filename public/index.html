<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poster Generator</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f4f4f9; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .preview-box { margin-bottom: 20px; }
        .preview-box img { max-width: 100%; height: auto; border-radius: 8px; border: 1px solid #ddd; }
        input, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background: #ff6600; color: white; font-weight: bold; border: none; cursor: pointer; }
        button:hover { background: #e05500; }
    </style>
</head>
<body>

<div class="container">
    <h2>Poster Generator</h2>

    <!-- Preview Section -->
    <div class="preview-box">
        <img id="posterPreview" src="/poster-template.png" alt="Poster Template Loading...">
    </div>

    <!-- Form Section -->
    <form id="posterForm">
        <input type="text" id="nameInput" placeholder="Apna Naam Likhein" required>
        <input type="tel" id="mobileInput" placeholder="Mobile Number Likhein" required>
        <input type="file" id="photoInput" accept="image/*">
        
        <button type="submit" id="generateBtn">Generate & Download Poster</button>
    </form>
</div>

<script>
    // Configuration object for layout alignment
    const posterConfig = {
        templateWidth: 1080,
        templateHeight: 1350,
        nameX: 145,
        nameY: 1192,
        fontSizeName: 32,
        fontColorName: '#000000',
        mobileX: 180,
        mobileY: 1266,
        fontSizeMobile: 28,
        fontColorMobile: '#000000',
        photoX: 56,
        photoY: 746,
        photoWidth: 348,
        photoHeight: 382
    };

    document.getElementById('posterForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('generateBtn');
        btn.innerText = 'Generating Poster...';
        btn.disabled = true;

        const formData = new FormData();
        formData.append('name', document.getElementById('nameInput').value);
        formData.append('mobile', document.getElementById('mobileInput').value);
        formData.append('config', JSON.stringify(posterConfig));

        const photoFile = document.getElementById('photoInput').files[0];
        if (photoFile) {
            formData.append('image', photoFile);
        }

        try {
            // RELATIVE PATH: Works on localhost AND Vercel
            const response = await fetch('/api/generate', {
                method: 'POST',
                body: formData
            });

            if (!response.ok) {
                throw new Error('Generation failed on server');
            }

            const blob = await response.blob();
            const downloadUrl = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = `${document.getElementById('nameInput').value || 'Poster'}_Generated.png`;
            document.body.appendChild(a);
            a.click();
            a.remove();

        } catch (error) {
            console.error('Error:', error);
            alert('Failed to generate poster. Please try again.');
        } finally {
            btn.innerText = 'Generate & Download Poster';
            btn.disabled = false;
        }
    });
</script>

</body>
</html>
