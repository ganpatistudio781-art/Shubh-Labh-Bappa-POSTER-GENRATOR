<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shubh Labh Bappa - Poster Generator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            color: #333;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        /* 1. Channel Name */
        .channel-title {
            font-size: 26px;
            font-weight: bold;
            color: #ff5722;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        /* 2. YouTube Channel Link */
        .channel-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #ffffff;
            background-color: #ff0000;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.3s;
        }
        .channel-link:hover {
            background-color: #cc0000;
        }
        /* 3. Poster Preview / Container */
        .poster-section {
            margin-bottom: 20px;
        }
        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #444;
        }
        .poster-preview {
            width: 100%;
            height: 350px;
            background: #f0f0f0;
            border: 2px dashed #ccc;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            background-size: cover;
            background-position: center;
        }
        #posterCanvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 8px;
        }
        /* 4. Form Inputs & Button */
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 5px;
            color: #555;
        }
        .form-control {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        .form-control:focus {
            border-color: #ff5722;
        }
        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 5px;
        }
        .btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. Channel Name -->
        <div class="channel-title">Shubh Labh Bappa</div>

        <!-- 2. YouTube Channel Link -->
        <a href="https://youtube.com/@ganpati_shubhlabh23?si=YC3ffPcw5cYLBn_c" target="_blank" class="channel-link">
            📺 Subscribe YouTube Channel
        </a>

        <!-- 3. Poster Preview Section -->
        <div class="poster-section">
            <div class="section-title">Preview Poster</div>
            <div class="poster-preview" id="previewBox">
                <canvas id="posterCanvas" style="display:none;"></canvas>
                <span id="placeholderText" style="color: #888; font-size: 14px;">Poster yahan dikhega</span>
            </div>
        </div>

        <!-- 4. Inputs: Name, Number, Photo Upload & Generate Button -->
        <div class="form-group">
            <label for="userName">Apna Naam:</label>
            <input type="text" id="userName" class="form-control" placeholder="Apna naam yahan likhein">
        </div>

        <div class="form-group">
            <label for="userNumber">Mobile Number:</label>
            <input type="tel" id="userNumber" class="form-control" placeholder="Apna mobile number likhein">
        </div>

        <div class="form-group">
            <label for="userPhoto">Photo Upload Karein:</label>
            <input type="file" id="userPhoto" class="form-control" accept="image/*">
        </div>

        <button class="btn" onclick="generatePoster()">Generate Poster</button>
    </div>

    <script>
        function generatePoster() {
            const name = document.getElementById('userName').value;
            const number = document.getElementById('userNumber').value;
            const photoInput = document.getElementById('userPhoto');
            const canvas = document.getElementById('posterCanvas');
            const placeholder = document.getElementById('placeholderText');
            
            if (!name) {
                alert('Kripya apna naam darj karein!');
                return;
            }

            canvas.style.display = 'block';
            placeholder.style.display = 'none';

            const ctx = canvas.getContext('2d');
            // Canvas standard resolution
            canvas.width = 600;
            canvas.height = 750;

            // Background Design (Gradient)
            let gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#ff9933');
            gradient.addColorStop(0.5, '#ffcc00');
            gradient.addColorStop(1, '#ff5722');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Header text inside poster
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 30px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('SHUBH LABH BAPPA', canvas.width / 2, 50);

            // Draw Photo if uploaded
            if (photoInput.files && photoInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        // Draw circular or rectangular user photo frame
                        ctx.save();
                        ctx.beginPath();
                        ctx.arc(canvas.width / 2, 220, 90, 0, Math.PI * 2, true);
                        ctx.closePath();
                        ctx.clip();
                        ctx.drawImage(img, canvas.width / 2 - 90, 130, 180, 180);
                        ctx.restore();

                        // Border around photo
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 5;
                        ctx.beginPath();
                        ctx.arc(canvas.width / 2, 220, 90, 0, Math.PI * 2, true);
                        ctx.stroke();

                        drawDetails(ctx, name, number, canvas);
                    }
                    img.src = e.target.result;
                }
                reader.readAsDataURL(photoInput.files[0]);
            } else {
                // Default placeholder circle if no photo
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(canvas.width / 2, 220, 90, 0, Math.PI * 2, true);
                ctx.fill();
                
                ctx.fillStyle = '#333';
                ctx.font = '16px Arial';
                ctx.fillText('No Photo', canvas.width / 2, 225);

                drawDetails(ctx, name, number, canvas);
            }
        }

        function drawDetails(ctx, name, number, canvas) {
            // Name
            ctx.fillStyle = '#000000';
            ctx.font = 'bold 28px Arial';
            ctx.fillText(name, canvas.width / 2, 360);

            // Number
            if(number) {
                ctx.font = '20px Arial';
                ctx.fillText('Mob: ' + number, canvas.width / 2, 400);
            }

            // Footer / Channel Branding inside poster
            ctx.fillStyle = '#ffffff';
            ctx.font = 'italic 18px Arial';
            ctx.fillText('Blessed by Shubh Labh Bappa', canvas.width / 2, canvas.height - 40);
        }
    </script>
</body>
</html>
