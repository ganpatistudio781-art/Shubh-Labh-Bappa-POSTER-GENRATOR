<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Poster Generator</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Cropper.js CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main App Layout -->
    <div class="app-container">
        
        <!-- Header -->
        <header class="app-header">
            <div class="logo-badge">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
            </div>
            <h1>Poster Generator</h1>
        </header>

        <!-- Main Workspace -->
        <main class="workspace">
            
            <!-- Live Canvas Preview Container -->
            <div class="preview-section">
                <div class="canvas-card">
                    <canvas id="posterCanvas" width="1080" height="1350"></canvas>
                    <div class="live-tag"><span class="pulse"></span> Live Preview</div>
                </div>
            </div>

            <!-- Controls Panel -->
            <div class="controls-section">
                <div class="glass-card">
                    <h2><i class="fa-solid fa-sliders"></i> Customize Poster</h2>
                    
                    <form id="posterForm" onsubmit="event.preventDefault();">
                        
                        <!-- Upload Photo Trigger -->
                        <div class="form-group">
                            <label>Your Photo</label>
                            <button type="button" id="openUploadSheetBtn" class="btn btn-secondary btn-block">
                                <i class="fa-solid fa-cloud-arrow-up"></i> Upload Photo
                            </button>
                        </div>

                        <!-- Name Input -->
                        <div class="form-group">
                            <label for="userName">Full Name</label>
                            <div class="input-wrapper">
                                <i class="fa-regular fa-user"></i>
                                <input type="text" id="userName" placeholder="Enter full name" autocomplete="off">
                            </div>
                        </div>

                        <!-- Mobile Number Input -->
                        <div class="form-group">
                            <label for="userMobile">Mobile Number</label>
                            <div class="input-wrapper">
                                <i class="fa-solid fa-phone"></i>
                                <input type="tel" id="userMobile" placeholder="Enter mobile number" autocomplete="off">
                            </div>
                        </div>

                        <!-- Generate Action Button -->
                        <button type="button" id="generateBtn" class="btn btn-primary btn-block">
                            <i class="fa-solid fa-bolt"></i> Generate HD Poster
                        </button>

                    </form>
                </div>
            </div>

        </main>
    </div>

    <!-- Bottom Sheet Modal for Photo Options -->
    <div id="bottomSheetModal" class="modal-overlay">
        <div class="bottom-sheet">
            <div class="sheet-handle"></div>
            <h3>Select Photo Source</h3>
            <div class="sheet-options">
                <button type="button" id="cameraOptionBtn" class="sheet-btn">
                    <i class="fa-solid fa-camera"></i> Camera
                </button>
                <button type="button" id="galleryOptionBtn" class="sheet-btn">
                    <i class="fa-solid fa-images"></i> Gallery
                </button>
                <button type="button" id="closeSheetBtn" class="sheet-btn btn-cancel">
                    Cancel
                </button>
            </div>
        </div>
    </div>

    <!-- Hidden Native File Inputs -->
    <input type="file" id="galleryInput" accept="image/jpeg,image/jpg,image/png,image/webp,image/heic" style="display:none;">
    <input type="file" id="cameraInput" accept="image/*" capture="user" style="display:none;">

    <!-- Fullscreen Crop Modal -->
    <div id="cropModal" class="crop-modal">
        <div class="crop-header">
            <h3>Adjust Photo</h3>
            <button type="button" id="cancelCropBtn" class="btn-icon"><i class="fa-solid fa-xmark"></i></button>
        </div>
        
        <div class="crop-body">
            <div class="crop-container">
                <img id="cropImage" src="" alt="Image for cropping">
            </div>
        </div>

        <div class="crop-toolbar">
            <button type="button" id="rotateLeftBtn" class="tool-btn"><i class="fa-solid fa-rotate-left"></i> Rotate L</button>
            <button type="button" id="rotateRightBtn" class="tool-btn"><i class="fa-solid fa-rotate-right"></i> Rotate R</button>
            <button type="button" id="resetCropBtn" class="tool-btn"><i class="fa-solid fa-arrows-rotate"></i> Reset</button>
        </div>

        <div class="crop-footer">
            <button type="button" id="applyCropBtn" class="btn btn-primary btn-block">
                <i class="fa-solid fa-check"></i> Done
            </button>
        </div>
    </div>

    <!-- Fullscreen Loading Spinner Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner-card">
            <div class="spinner"></div>
            <p id="loadingText">Generating HD Poster...</p>
        </div>
    </div>

    <!-- Cropper.js JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
