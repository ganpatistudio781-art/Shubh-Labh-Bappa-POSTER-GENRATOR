<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiritual Poster Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Warm spiritual tone for the background */
        body {
            background-color: #fffaf0; 
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Main UI Card -->
    <div class="bg-white border-t-4 border-orange-500 shadow-2xl rounded-2xl w-full max-w-md p-6 sm:p-8 space-y-6">
        
        <!-- Header -->
        <div class="text-center">
            <h1 class="text-3xl font-bold text-orange-600 mb-2">Poster Generator</h1>
            <p class="text-orange-400 text-sm font-medium">Create your personalized spiritual poster</p>
        </div>

        <!-- YouTube Channel Link -->
        <div class="flex items-center justify-center bg-orange-50 rounded-lg p-3 border border-orange-200 shadow-sm">
            <svg class="w-6 h-6 text-red-600 mr-2" fill="currentColor" viewBox="0 0 24 24">
                <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
            </svg>
            <span class="text-gray-700 font-medium text-sm">Subscribe: </span>
            <a href="https://youtube.com/@ganpati_shubhlabh23?si=BSfYGSNcZTXVtLz-" target="_blank" class="ml-2 text-orange-600 hover:text-orange-800 font-bold underline decoration-orange-400 decoration-2 transition">
                shubh labh bappa
            </a>
        </div>

        <!-- Form Layout -->
        <form class="space-y-5" onsubmit="event.preventDefault(); /* Add your generate script logic here */">
            
            <!-- 1. Name Field -->
            <div>
                <label for="name" class="block text-sm font-semibold text-gray-800 mb-1">Full Name</label>
                <input type="text" id="name" placeholder="Enter your name" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition shadow-sm" required>
            </div>

            <!-- 2. Number Field -->
            <div>
                <label for="number" class="block text-sm font-semibold text-gray-800 mb-1">Mobile Number</label>
                <input type="tel" id="number" placeholder="Enter your mobile number" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition shadow-sm" required>
            </div>

            <!-- 3. Upload Photo Field -->
            <div>
                <label for="photo" class="block text-sm font-semibold text-gray-800 mb-1">Upload Photo</label>
                <div class="mt-1 flex justify-center px-6 pt-6 pb-6 border-2 border-gray-300 border-dashed rounded-lg hover:border-orange-500 hover:bg-orange-50 transition bg-gray-50 cursor-pointer" onclick="document.getElementById('photo').click()">
                    <div class="space-y-2 text-center">
                        <svg class="mx-auto h-12 w-12 text-orange-500" stroke="currentColor" fill="none" viewBox="0 0 48 48" aria-hidden="true">
                            <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                        <div class="flex text-sm text-gray-600 justify-center">
                            <span class="relative cursor-pointer bg-transparent rounded-md font-bold text-orange-600 hover:text-orange-500 focus-within:outline-none">
                                <span>Click to upload a file</span>
                                <input id="photo" name="photo" type="file" class="sr-only" accept="image/*">
                            </span>
                        </div>
                        <p class="text-xs text-gray-500">PNG, JPG up to 10MB</p>
                    </div>
                </div>
            </div>

            <!-- 4. Generate Poster Button -->
            <button type="submit" class="w-full bg-gradient-to-r from-orange-500 to-orange-600 hover:from-orange-600 hover:to-orange-700 text-white font-bold py-3.5 px-4 rounded-lg shadow-md hover:shadow-xl transition transform hover:-translate-y-0.5 mt-2">
                Generate Poster
            </button>

        </form>
    </div>

</body>
</html>
