<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Poster Generator</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.css">

<link rel="stylesheet"
href="style.css">

</head>

<body>

<div class="app">

<header class="topBar">

<h1>Poster Generator</h1>

<p>Create Beautiful Posters Instantly</p>

</header>

<main>

<section class="previewCard">

<div class="posterPreview">

<canvas
id="posterCanvas"
width="1080"
height="1350">
</canvas>

</div>

</section>

<section class="editorCard">

<h2>Poster Details</h2>

<div class="inputGroup">

<label>

Your Name

</label>

<input
type="text"
id="nameInput"
placeholder="Enter your name"
maxlength="30">

</div>

<div class="inputGroup">

<label>

Mobile Number

</label>

<input
type="tel"
id="mobileInput"
placeholder="Enter mobile number"
maxlength="10">

</div>
<div class="inputGroup">

<label>

Upload Photo

</label>

<button
type="button"
id="uploadBtn"
class="primaryBtn">

📷 Upload Photo

</button>

<input
type="file"
id="photoInput"
accept="image/*"
hidden>

</div>

<div class="buttonGroup">

<button
type="button"
id="generateBtn"
class="generateBtn">

✨ Generate Poster

</button>

<a
id="downloadBtn"
class="downloadBtn"
download="Poster.png">

⬇ Download Poster

</a>

</div>

</section>

</main>


<!-- Camera / Gallery Bottom Sheet -->

<div
id="photoSheet"
class="photoSheet">

<div class="sheetContent">

<h3>

Select Photo

</h3>

<button
id="cameraBtn"
class="sheetBtn">

📷 Camera

</button>

<button
id="galleryBtn"
class="sheetBtn">

🖼 Gallery

</button>

<button
id="closeSheetBtn"
class="cancelSheetBtn">

Cancel

</button>

</div>

</div>
<!-- Crop Editor -->

<div id="cropModal" class="cropModal">

    <div class="cropContainer">

        <div class="cropHeader">

            <h2>Adjust Photo</h2>

        </div>

        <div class="cropBody">

            <img id="cropImage" alt="Crop Image">

        </div>

        <div class="cropTools">

            <button id="zoomInBtn" class="toolBtn">+</button>

            <button id="zoomOutBtn" class="toolBtn">−</button>

            <button id="rotateLeftBtn" class="toolBtn">↺</button>

            <button id="rotateRightBtn" class="toolBtn">↻</button>

            <button id="resetBtn" class="toolBtn">Reset</button>

        </div>

        <div class="cropActions">

            <button id="cancelCropBtn" class="cancelBtn">

                Cancel

            </button>

            <button id="doneCropBtn" class="doneBtn">

                Done

            </button>

        </div>

    </div>

</div>


<!-- Loading -->

<div id="loader" class="loader">

    <div class="loaderBox">

        <div class="spinner"></div>

        <p>Generating Poster...</p>

    </div>

</div>


<footer>

<p>

Poster Generator

</p>

</footer>

</div>


<script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script src="script.js"></script>

</body>

</html>
