<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Poster Generator</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.css">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<header>

<h1>Poster Generator</h1>

<p>Create Beautiful Posters in Seconds</p>

</header>

<section class="previewCard">

<div class="posterBox">

<canvas id="posterCanvas" width="1080" height="1350"></canvas>

</div>

</section>

<section class="formCard">

<h2>Poster Details</h2>

<label>Name</label>

<input
type="text"
id="name"
placeholder="Enter Name"
maxlength="30">

<label>Mobile Number</label>

<input
type="tel"
id="mobile"
placeholder="Enter Mobile Number"
maxlength="10">
<label>Upload Photo</label>

<button id="uploadPhotoBtn" class="primaryBtn">
📷 Upload Photo
</button>

<input
type="file"
id="photoInput"
accept="image/*"
hidden>

<div id="photoOptions" class="bottomSheet">

<div class="sheetBox">

<h3>Select Photo</h3>

<button id="cameraBtn" class="sheetBtn">
📷 Camera
</button>

<button id="galleryBtn" class="sheetBtn">
🖼 Gallery
</button>

<button id="closeSheetBtn" class="sheetBtn cancel">
❌ Cancel
</button>

</div>

</div>

<button id="generateBtn" class="primaryBtn">

✨ Generate Poster

</button>

<a
id="downloadBtn"
class="downloadBtn"
download="Poster.png">

⬇ Download Poster

</a>

</section>
<!-- Crop Editor -->

<div id="cropModal" class="cropModal">

    <div class="cropCard">

        <h2>Adjust Photo</h2>

        <img id="cropImage">

        <div class="toolBar">

            <button id="zoomInBtn">➕</button>

            <button id="zoomOutBtn">➖</button>

            <button id="rotateLeftBtn">↺</button>

            <button id="rotateRightBtn">↻</button>

        </div>

        <div class="actionBar">

            <button id="cancelCropBtn" class="cancelBtn">

                Cancel

            </button>

            <button id="doneCropBtn" class="doneBtn">

                Done

            </button>

        </div>

    </div>

</div>

<footer>

<a
href="https://youtube.com/@YOURCHANNEL"
target="_blank"
class="youtubeBtn">

📺 Visit Our YouTube Channel

</a>

</footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script src="script.js"></script>

</body>

</html>
