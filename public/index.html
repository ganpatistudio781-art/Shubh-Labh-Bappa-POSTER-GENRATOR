<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shubh Labh Poster Studio</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CropperJS CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="app-container">
        
        <!-- Header Banner -->
        <header class="header-card">
            <h1>Shubh Labh Poster Studio</h1>
            <p>Create Your Poster</p>
            <a href="https://youtube.com/@ganpati_shubhlabh23?si=BSfYGSNcZTXVtLz-" target="_blank" class="yt-button">
                <span class="pulse-dot"></span>
                <i class="fa-brands fa-youtube"></i> Visit YouTube Channel
            </a>
        </header>

        <!-- Section Title -->
        <h2 class="section-title">Live Preview</h2>

        <!-- Live Poster Preview -->
        <div class="preview-card">
            <div class="preview-container" id="preview-container">
                <div class="preview-wrapper" id="preview-wrapper">
                    <!-- Base Poster Template -->
                    <img src="poster-template.png" alt="Poster Template" id="template-img" class="template-img" crossorigin="anonymous">
                    
                    <!-- Overlaid Photo -->
                    <img id="preview-photo" class="preview-photo" style="display: none;">
                    
                    <!-- Overlaid Realtime Text -->
                    <div id="preview-name" class="preview-text"></div>
                    <div id="preview-mobile" class="preview-text"></div>
                </div>
            </div>
        </div>

        <!-- Inputs Card -->
        <section class="form-card">
            <h3 class="form-title">Poster Details</h3>

            <div class="form-group">
                <label for="nameInput">Full Name</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="nameInput" placeholder="Enter your name" autocomplete="off">
                </div>
            </div>

            <div class="form-group">
                <label for="mobileInput">Mobile Number</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-phone"></i>
                    <input type="tel" id="mobileInput" placeholder="Enter mobile number" maxlength="15" autocomplete="off">
                </div>
            </div>

            <button class="btn btn-secondary" id="btn-upload">
                <i class="fa-solid fa-camera"></i> Upload Photo
            </button>
            
            <button class="btn btn-primary" id="btn-generate">
                <i class="fa-solid fa-download"></i> Generate Poster
            </button>
        </section>

    </main>

    <!-- Mobile Bottom Sheet for Image Selection -->
    <div class="bottom-sheet-overlay" id="sheet-overlay"></div>
    <div class="bottom-sheet" id="bottom-sheet">
        <div class="sheet-header">
            <div class="sheet-drag-handle"></div>
            <h3>Select Image Source</h3>
        </div>
        <div class="sheet-options">
            <label class="sheet-option">
                <i class="fa-solid fa-camera text-orange"></i>
                <span>Take Photo (Camera)</span>
                <input type="file" accept="image/*" capture="user" id="cameraInput" hidden>
            </label>
            <label class="sheet-option">
                <i class="fa-solid fa-images text-orange"></i>
                <span>Choose from Gallery</span>
                <input type="file" accept="image/*" id="galleryInput" hidden>
            </label>
            <div class="sheet-option text-danger" id="btn-cancel-sheet">
                <i class="fa-solid fa-xmark"></i>
                <span>Cancel</span>
            </div>
        </div>
    </div>

    <!-- Full Screen Crop Page -->
    <div class="crop-page" id="crop-page">
        <div class="crop-header">
            <button id="btn-crop-cancel"><i class="fa-solid fa-arrow-left"></i></button>
            <h2>Adjust & Crop Photo</h2>
            <button id="btn-crop-done" class="btn-done"><i class="fa-solid fa-check"></i> Done</button>
        </div>
        <div class="crop-container">
            <img id="crop-image" src="" alt="Crop Area">
        </div>
        <div class="crop-tools">
            <button class="tool-btn" id="btn-rotate-left" title="Rotate Left"><i class="fa-solid fa-rotate-left"></i></button>
            <button class="tool-btn" id="btn-rotate-right" title="Rotate Right"><i class="fa-solid fa-rotate-right"></i></button>
            <button class="tool-btn" id="btn-flip-x" title="Flip Mirror"><i class="fa-solid fa-right-left"></i></button>
        </div>
    </div>

    <!-- Loading Screen -->
    <div class="loading-overlay" id="loading-overlay">
        <div class="spinner"></div>
        <p>Generating HD Poster...</p>
    </div>

    <!-- CropperJS Script -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
